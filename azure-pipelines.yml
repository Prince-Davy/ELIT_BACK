trigger:
  tags:
    include:
      - "*.*.*"
  branches:
    include:
      - "*"

resources:
  repositories:
    - repository: templates
      type: git
      endpoint: SogetiLabsFranceRepository
      name: LGE_Templates/LGE_Templates

pool: labs-pool

variables:
  - name: project_group
    value: "ELIT"
  - name: project_name
    value: "lge_elit_back"
  - name: imageRepository
    value: lge-elit/lge-elit-back
  - name: dockerRegistryServiceConnection
    value: SogetiLabsFranceRegistry
  - name: dockerfilePath
    value: $(Build.SourcesDirectory)/Dockerfile
  - name: deploymentName
    value: "elit-back"
  - name: deploymentIntegName
    value: "elit-back-integ"
  - name: kubernetesNamespace
    value: "lge-elit"
  - name: kubernetesIntegNamespace
    value: "lge-elit"
  - name: kubernetesSecret
    value: "lge-elit-config"
  - name: kubernetesIntegSecret
    value: "lge-elit-config-integ"
  # Include template variables
  - template: templates-general/variables.yml@templates

extends:
  template: templates-general/azure-general-java-tpl.yml@templates
  parameters:
    DEPLOY_INTEG: true
    DEPLOY_PROD: false
    SCAN_SQ: true
    NO_QUALITY_FAIL: true

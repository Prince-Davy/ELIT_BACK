trigger:
  tags:
    include:
      - "*.*.*"
  branches:
    include:
      - develop
      - devops
      - main
      - recette
      - release/*

pr:
  branches:
    include:
      - develop
      - devops
      - main
      - recette
      - release/*

resources:
  repositories:
    - repository: templates
      type: git
      endpoint: SogetiLabsFranceRepository
      name: LGE_Templates/LGE_Templates
      ref: wip-experimental-helm

pool: labs-pool

variables:
  - name: project_group
    value: "ELIT"
  - name: project_name
    value: "lge-elit-back"
  - name: imageRepository
    value: lge-elit/lge-elit-back
  - name: dockerRegistryServiceConnection
    value: SogetiLabsFranceRegistry
  - name: dockerfilePath
    value: $(Build.SourcesDirectory)/Dockerfile
  - name: kubernetesNamespace
    value: "lge-elit"
  - name: kubernetesNamespaceInteg
    value: "lge-elit"
  # Include specific variables of Quality and Security
  - name: SKIP_DOXYGEN
    value: false
  - name: SKIP_QUALITY
    value: false
  - name: SKIP_SECURITY
    value: false
  # Include template variables
  - template: templates-general/variables.yml@templates
  - group: elit_back_library

extends:
  template: templates-general/azure-general-java-tpl.yml@templates
  parameters:
    DEPLOY_INTEG: true
    DEPLOY_PROD: false
    DEPLOY_TEST: true
    NO_DOXYGEN_FAIL: true
    NO_QUALITY_FAIL: true
    NO_SECURITY_FAIL: true
    NO_SONAR_FAIL: true
    SCAN_SQ: true

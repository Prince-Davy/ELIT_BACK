version: '3.3'

services:
  db:
    container_name: 'elit_database'
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - elit-volume:/var/lib/mysql
    networks:
      - elit_network

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - elit_network

  back:
    container_name: 'elit_backend'
    build:
      context: "."
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./out/:/usr/src/app/out/
    depends_on:
      - db
    networks:
      - elit_network

volumes:
  elit-volume:

networks:
  elit_network:

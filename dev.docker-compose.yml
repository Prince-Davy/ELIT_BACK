version: '3.3'

services:

  db:
    container_name: 'elit_database'
    image: mysql:5.7
    environment:
      POSTGRES_USER: ${MYSQL_USER}
      POSTGRES_PASSWORD: ${MYSQL_PASSWORD}
      db_address: ${MYSQL_URL}
    volumes:
        - elit-volume:/var/lib/mysql

  back:
    container_name: 'elit_backend'
    build:
      context: "."
      dockerfile: Dockerfile
    env_file: .env
    ports: 
      - 8080:8080
    environment:
        db_address: ${SPRING_DATASOURCE_URL}
    volumes:
        - ./out/:/usr/src/app/out/
    depends_on:
        - db

  adminer:
    container_name: 'elit_adminer'
    image: 'adminer:4.8.1-standalone'
    ports:
      - '8083:8080'
    environment:
      - ADMINER_DEFAULT_SERVER=${_ADMINER_DEFAULT_SERVER}
      - ADMINER_DESIGN=${_ADMINER_DESIGN}

volumes:
  elit-volume:
[supervisord]
nodaemon=true

[program:project-back]
process_name=project-back
command=mvn spring-boot:run
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0


[program:filebeat]
command=/usr/share/filebeat/bin/filebeat --path.config /usr/share/filebeat/config/
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

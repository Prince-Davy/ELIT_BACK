# must be unique in a given SonarQube instance
sonar.projectKey=elit_back

sonar.host.url=https://sonarqube.innovation-factory.io/

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources=src/main
# Pointer sur les classes compilees (et non le dossier target/ entier) pour que SonarJava
# resolve les getters/setters generes par Lombok et les mappers MapStruct : sans cela, les
# champs de DTO/entites Lombok sont signales a tort par S1068 (unused private field).
sonar.java.binaries=target/classes
sonar.java.libraries=target/classes
sonar.java.test.binaries=target/test-classes
# Le scanner CLI ne lit pas maven.compiler.release du pom : sans cela il prend Java 8 par defaut et
# n'arrive pas a parser les records / switch expressions (analyse faussee). On fige donc la version.
sonar.java.source=21
# sonar.java.libraries=target/*.jar
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=2000

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# PMD
sonar.pmd.analyzeOnly=true
sonar.pmd.reportPath=target/pmd.xml

# Java CheckStyle
sonar.checkstyle.analyzeOnly=true
sonar.checkstyle.reportPath=target/checkstyle-result.xml

# JUnit
sonar.tests=src/test
sonar.junit.reportsPath=target/surefire-reports
sonar.surefire.reportsPath=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Branch
# sonar.branch.name=${env.SONAR_BRANCH}

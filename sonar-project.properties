# must be unique in a given SonarQube instance
sonar.projectKey=elit_back

sonar.host.url=https://sonarqube.innovation-factory.io/

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources=src/main
sonar.java.binaries=target/
# sonar.java.libraries=target/*.jar
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=2000

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# PMD
sonar.pmd.analyzeOnly=true
sonar.pmd.reportPath=target/pmd.xml

# Java CheckStyle
sonar.checkstyle.analyzeOnly=true
sonar.checkstyle.reportPath=target/checkstyle-result.xml

# JUnit
sonar.tests=src/test
sonar.junit.reportsPath=target/surefire-reports
sonar.surefire.reportsPath=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.binaries=target/classes
sonar.java.coveragePlugin=jacoco

# Branch
# sonar.branch.name=${env.SONAR_BRANCH}

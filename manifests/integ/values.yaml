# Default values for lge-deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
# Configure the tag based on your environment. The tags are usually generated by the pipeline:
# - latest-integ
# - latest-test
# - latest
image:
  repository: sogetilabsfrance.azurecr.io/lge-elit/lge-elit-back
  # This sets the pull policy for images.
  # pullPolicy: IfNotPresent
  tag: "latest-integ"

# This is to override the chart name. It can usually be left empty.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
# The service account may already exist, in that case, keep `create` to `false`.
# When creating a service account, make sure a role exist in the vault to reference it
# and give it read access to secrets.
serviceAccount:
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "lge-elit-sa"
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
# You may use the annotations for setting up url rewrites, proxying headers, or more.
# Uncomment the relevant snippets and remove the `{}`.
# TLS is used for certificate configuration. When setting it up, remove the `[]`
ingress:
  enabled: true
  className: ""
  annotations:
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  # nginx.ingress.kubernetes.io/configuration-snippet: |
  # more_set_headers "X-Forwarded-For $proxy_protocol_addr";
  # more_set_headers "X-Forwarded-Proto $scheme";
  # more_set_headers "X-Forwarded-Host $host";
  # more_set_headers "Forwarded $proxy_add_forwarded";
  hosts:
    - host: integ.lge-elit.innovation-factory.io
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: integ.lge-elit.innovation-factory.io-secret
      hosts:
        - integ.lge-elit.innovation-factory.io

# Setup your application's resources here.
# m = milliCPU, 1000m = 1.
# A frontend application that only serves static resources may work with a small value (20m-50m).
# A backend application may need higher requests (100m or more).
#
# When the CPU limit is reached, the pod is throttled, but when the memory limit is reached,
# the pod is killed, make sure to not set the memory limit too low.
# A CPU limit is not strictly necessary.
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    # cpu: 100m
    memory: 1Gi

# Use key-value pairs to define the deployment's environment variables.
env:
  PORT: 8080
  ASPNETCORE_ENVIRONMENT: Development
  SPRING_MAIL_USERNAME: "$(SPRING_MAIL_USERNAME)"

# The secret path defined on the top level is where secrets are queried from.
# It can be overridden for each variable.
# If the secret key is different in the vault than how the environment variable should be named,
# you can define the `vaultKey` value separately, otherwise, it defaults to the `key` value.
secrets:
  enabled: true
  roleName: lge-elit-integ
  secretPath: secret/data/lge/elit/integ
  data:
    - vaultKey: MYSQL_ROOT_PASSWORD
      key: MYSQL_ROOT_PASSWORD
    - vaultKey: MYSQL_USER
      key: MYSQL_USER
    - vaultKey: MYSQL_PASSWORD
      key: MYSQL_PASSWORD
    - vaultKey: MYSQL_DATABASE
      key: MYSQL_DATABASE
    - vaultKey: DB_SERVER
      key: DB_SERVER
    - vaultKey: SPRING_BACK_USERNAME
      key: SPRING_BACK_USERNAME
    - vaultKey: SPRING_BACK_PASSWORD
      key: SPRING_BACK_PASSWORD
    - vaultKey: JWT_SECRET_BACK
      key: JWT_SECRET_BACK
    - vaultKey: FILE_UPLOAD_DIR
      key: FILE_UPLOAD_DIR
    - vaultKey: AVATAR_UPLOAD_DIR
      key: AVATAR_UPLOAD_DIR
    - vaultKey: FILE_QUESTIONS
      key: FILE_QUESTIONS
    - vaultKey: SPRING_MAIL_USERNAME
      key: SPRING_MAIL_USERNAME
    - vaultKey: SPRING_MAIL_PASSWORD
      key: SPRING_MAIL_PASSWORD
    - vaultKey: REACT_APP_BACKEND_API
      key: REACT_APP_BACKEND_API
    - vaultKey: FRONTEND_URL
      key: FRONTEND_URL
    - vaultKey: FILE_RECOMMANDATIONS
      key: FILE_RECOMMANDATIONS
    - vaultKey: PORT
      key: PORT


  # --- THIS SECTION IS FOR MORE COMPLEX CONFIGURATION --- ##
  # --- You may not need to edit it --- #

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

#This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # livenessProbe:
  #   httpGet:
  #     path: /
  #     port: http
  # readinessProbe:
  #   httpGet:
  #     path: /
  #     port: http

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}

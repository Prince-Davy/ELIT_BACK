apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lge-elit-back
  name: elit-back
  namespace: lge-elit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lge-elit-back
  template:
    metadata:
      labels:
        app: lge-elit-back
    spec:
      containers:
        - name: lge-elit-back
          imagePullPolicy: Always
          image: sogetilabsfrance.azurecr.io/lge-elit/lge-elit-back:latest-integ
          volumeMounts:
            - mountPath: /mnt/secrets-store
              name: secrets-store-inline
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 200m
              memory: 600Mi
            requests:
              cpu: 100m
              memory: 250Mi
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  key: MYSQL_USER
                  name: lge-elit-integ-config
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MYSQL_PASSWORD
                  name: lge-elit-integ-config
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MYSQL_ROOT_PASSWORD
                  name: lge-elit-integ-config
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  key: MYSQL_DATABASE
                  name: lge-elit-integ-config
            - name: DB_SERVER
              valueFrom:
                secretKeyRef:
                  key: DB_SERVER
                  name: lge-elit-integ-config
            - name: SPRING_BACK_USERNAME
              valueFrom:
                secretKeyRef:
                  key: SPRING_BACK_USERNAME
                  name: lge-elit-integ-config
            - name: SPRING_BACK_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: SPRING_BACK_PASSWORD
                  name: lge-elit-integ-config
            - name: JWT_SECRET_BACK
              valueFrom:
                secretKeyRef:
                  key: JWT_SECRET_BACK
                  name: lge-elit-integ-config
            - name: FILE_UPLOAD_DIR
              valueFrom:
                secretKeyRef:
                  key: FILE_UPLOAD_DIR
                  name: lge-elit-integ-config
            - name: AVATAR_UPLOAD_DIR
              valueFrom:
                secretKeyRef:
                  key: AVATAR_UPLOAD_DIR
                  name: lge-elit-integ-config
            - name: FILE_QUESTIONS
              valueFrom:
                secretKeyRef:
                  key: FILE_QUESTIONS
                  name: lge-elit-integ-config
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  key: SPRING_MAIL_USERNAME
                  name: lge-elit-integ-config
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: SPRING_MAIL_PASSWORD
                  name: lge-elit-integ-config
            - name: REACT_APP_BACKEND_API
              valueFrom:
                secretKeyRef:
                  key: REACT_APP_BACKEND_API
                  name: lge-elit-integ-config
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  key: FRONTEND_URL
                  name: lge-elit-integ-config
      volumes:
        - name: secrets-store-inline
          csi:
            driver: 'secrets-store.csi.k8s.io'
            readOnly: true
            volumeAttributes:
              secretProviderClass: "secret-provider-lge-elit-integ"
# Allow ArchUnit to create the freeze store on first run (Étape 0 migration).
# Frozen violations live under src/test/resources/archunit_store and are progressively
# purged as each context is migrated; no new violation is allowed.
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false
freeze.store.default.path=src/test/resources/archunit_store

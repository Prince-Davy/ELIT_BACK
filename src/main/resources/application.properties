########################################################################
#                                                                      #
#                   DEFAULT APPLICATION PROPERTIES                     #
#                                                                      #
########################################################################

#LOGGS FOR TRANSACTIONS
logging.level.root=INFO
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.transaction=DEBUG


########################################################################
#                                  DB                                  #
########################################################################

spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USER}
spring.datasource.url=jdbc:mysql://${DB_SERVER}/${DB_NAME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization= false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

########################################################################
#                               LIQUIBASE                              #
########################################################################

spring.liquibase.enabled=true
spring.liquibase.contexts=prod,data,fakedata
spring.liquibase.change-log=classpath:config/liquibase/master.xml

########################################################################
#                               SECURITY                               #
########################################################################

spring.security.user.name=${SPRING_BACK_USERNAME}
spring.security.user.password=${SPRING_BACK_PASSWORD}

jwt.secret=${JWT_SECRET_BACK}

########################################################################

#Expiration date for Tokens (in milliseconds)
#tokens.expiration-time=30*60*1000
#Files' upload Configuration
spring.servlet.multipart.enabled=true

#uploading directory (Please Make sure you change this to the absolute path of the folder in the hosting machine)

file.upload-dir = ${FILE_UPLOAD_DIR}
avatar.upload-dir = ${AVATAR_UPLOAD_DIR}

# Questions File  (Please Make sure you change this to the absolute path of the folder in the hosting machine)
file.questions-file = ${FILE_QUESTIONS}

#Threshold after which files are written to the disk
spring.servlet.multipart.file-size-threshold = 2KB
#Max File Size
spring.servlet.multipart.max-file-size = 200MB
#Max Request Size
spring.servlet.multipart.max-request-size = 215MB

## For Email Configuration
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher




########################################################################
#                                                                      #
#                   DEFAULT APPLICATION PROPERTIES                     #
#                                                                      #
########################################################################

#LOGGS FOR TRANSACTIONS
logging.level.root=INFO
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.security=DEBUG



########################################################################
#                                  DB                                  #
########################################################################

spring.jpa.database=mysql
spring.jpa.show-sql=false
spring.datasource.url=jdbc:mysql://${DB_SERVER}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect


########################################################################
#                               LIQUIBASE                              #
########################################################################

spring.liquibase.enabled=true
spring.liquibase.contexts=prod,data,fakedata
spring.liquibase.change-log=classpath:config/liquibase/master.xml

########################################################################
#                               SECURITY                               #
########################################################################

spring.security.user.name=${SPRING_BACK_USERNAME}
spring.security.user.password=${SPRING_BACK_PASSWORD}

#Expiration date for Tokens 15min (in milliseconds)
jwt.expiration-time = 900000
jwt.secret=${JWT_SECRET_BACK}
########################################################################
#                               CONFIG FILE                            #
########################################################################

spring.config.import=optional:file:.env[.properties]

########################################################################


#Files' upload Configuration
spring.servlet.multipart.enabled=true

#uploading directory (Please Make sure you change this to the absolute path of the folder in the hosting machine)

file.upload-dir = ${FILE_UPLOAD_DIR}
avatar.upload-dir = ${AVATAR_UPLOAD_DIR}

# Questions File  (Please Make sure you change this to the absolute path of the folder in the hosting machine)
file.questions-file = ${FILE_QUESTIONS}

# Max Allowed Evaluation for a question
max-allowed-evaluation = 5

#Threshold after which files are written to the disk
spring.servlet.multipart.file-size-threshold = 2KB
#Max File Size
spring.servlet.multipart.max-file-size = 200MB
#Max Request Size
spring.servlet.multipart.max-request-size = 215MB

## For Email Configuration
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher


# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-login-endpoint=true
springdoc.show-oauth2-endpoints=true
springdoc.openapi.info.title=ELIT-API-Doc-Prod
springdoc.openapi.info.description=ELIT api documentaion in production
springdoc.openapi.info.version=v1.0

# values of url back and front
backend.value-url=${REACT_APP_BACKEND_API}
frontend.value-url=${FRONTEND_URL}

#servlet context root path
server.servlet.context-path=/api

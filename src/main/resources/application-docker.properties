########################################################################
#                   DOCKER PROFILE OVERRIDES                           #
#                                                                      #
# Only properties that differ from application.properties (the common  #
# base) live here — Spring loads the base first, then this file.       #
########################################################################

# --- Logging ---
logging.level.com.elit.outildedecision=DEBUG

# --- DB / JPA ---
# DB reached through the docker-compose service host
spring.datasource.url=jdbc:mysql://${DB_SERVER_WITH_DOCKER}/${MYSQL_DATABASE}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create

# --- Security ---
# Shorter access token in dev (30 min)
jwt.access-token-expiration-time=1800000

# --- PMM / AI prediction ---
ia.prediction.api.base.url=${AI_API_URL_WITH_DOCKER}


########################################################################
#                                                                      #
#                  PROFILE TEST APPLICATION PROPERTIES                 #
#                                                                      #
########################################################################


########################################################################
#                              H2 DATABSE                              #
########################################################################

spring.jpa.database=H2
spring.jpa.show-sql=true
spring.datasource.url=jdbc:h2:mem:titi;INIT=CREATE SCHEMA IF NOT EXISTS outilprisedecision
spring.datasource.username=outildedecision
spring.datasource.password=outildedecision
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

########################################################################
#                               LIQUIBASE                              #
########################################################################

spring.liquibase.enabled= true
spring.liquibase.contexts= prod,data,fakedata
spring.liquibase.change-log=classpath:config/liquibase/master.xml

########################################################################
#                               SECURITY                               #
########################################################################

spring.security.user.name=${TEST_SPRING_BACK_USERNAME:root}
spring.security.user.password=${TEST_SPRING_BACK_PASSWORD:root}
spring.security.aes=sampleTestAESKey


########################################################################



#Expiration date for Tokens (in milliseconds)
#tokens.expiration-time=30*60*1000
#Files' upload Configuration
spring.servlet.multipart.enabled=true

#uploading directory (Please Make sure you change this to the absolute path of the folder in the hosting machine)

file.upload-dir = TT
avatar.upload-dir = TT

# Questions File  (Please Make sure you change this to the absolute path of the folder in the hosting machine)
file.questions-file = TT

#Threshold after which files are written to the disk
spring.servlet.multipart.file-size-threshold = 2KB
#Max File Size
spring.servlet.multipart.max-file-size = 200MB
#Max Request Size
spring.servlet.multipart.max-request-size = 215MB

## For Email Configuration
spring.mail.username=TT
spring.mail.password=TT
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher






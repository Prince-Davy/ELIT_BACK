########################################################################
#                   TEST PROFILE OVERRIDES                             #
#                                                                      #
# Only properties that differ from application.properties (the common  #
# base) live here. The test profile must boot with H2, no network and  #
# no .env — the snapshot harness relies on it staying self-contained.  #
########################################################################

########################################################################
#                                  DB                                  #
########################################################################
spring.jpa.database=H2
spring.datasource.url=jdbc:h2:mem:outilprisedecision;NON_KEYWORDS=VALUE,USER
spring.datasource.username=
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

########################################################################
#                                 SEED                                 #
########################################################################
# Each test seeds its own deterministic data, so the startup seed is disabled
# here to avoid colliding with the per-journey fixtures (and the reference
# scripts use the MySQL dialect, not the H2 test database).
app.seed.demo.enabled=false
app.seed.reference.enabled=false
# Demo seeding is disabled above; this only satisfies the bean's required property at construction.
app.seed.demo.password=disabled-in-test

# Disable the scheduled pending-account purge under test (cleanup is exercised
# directly via PendingAccountCleanupServiceImplTest, never on a background timer).
user.cleanup.cron=-

########################################################################
#                               SECURITY                               #
########################################################################
spring.security.user.name=${TEST_SPRING_BACK_USERNAME:root}
spring.security.user.password=${TEST_SPRING_BACK_PASSWORD:root}
spring.security.aes=sampleTestAESKey

# Access token 15 min / refresh token 12 hrs (in milliseconds)
jwt.access-token-expiration-time=900000
jwt.refresh-token-expiration-time=43200000

# Fixed test secret so the test profile boots without .env (CI cold start). Test-only value.
jwt.secret=${JWT_SECRET_BACK:elit-test-jwt-secret-do-not-use-in-production-0123456789}

########################################################################
#                                FILES                                 #
########################################################################
# Upload directories: temporary build folders, never the host filesystem in test
file.upload-dir=target/test-uploads/files
avatar.upload-dir=target/test-uploads/avatars

########################################################################
#                                EMAIL                                 #
########################################################################
# Dummy credentials; the test profile never sends mail
spring.mail.username=TT
spring.mail.password=TT

########################################################################
#                          MISC BUSINESS RULES                         #
########################################################################
# Fixed test defaults so the context boots without .env
backend.value-url=${REACT_APP_BACKEND_API:http://localhost:8080/api}
frontend.value-url=${FRONTEND_URL:http://localhost:3000}

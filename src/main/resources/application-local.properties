########################################################################
#                                                                      #
#                   DEFAULT APPLICATION PROPERTIES                     #
#                                                                      #
########################################################################



########################################################################
#                               LOGGING                                #
########################################################################

logging.level.root=INFO

########################################################################
#                                  DB                                  #
########################################################################

spring.jpa.database=H2
spring.datasource.url=jdbc:h2:mem:outilprisedecision
spring.datasource.username=
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.hibernate.ddl-auto=update

########################################################################
#                               LIQUIBASE                              #
########################################################################

spring.liquibase.enabled=true
spring.liquibase.contexts=prod,data,fakedata
spring.liquibase.change-log=classpath:config/liquibase/master.xml

########################################################################
#                               SECURITY                               #
########################################################################

spring.security.user.name=${SPRING_BACK_USERNAME}
spring.security.user.password=${SPRING_BACK_PASSWORD}

#Expiration date for access tokens 15min (in milliseconds) 900000
jwt.access-token-expiration-time = 900000
#Expiration date for refresh token 12hrs (in milliseconds) 43200000
jwt.refresh-token-expiration-time = 43200000

jwt.secret=${JWT_SECRET_BACK}

########################################################################
#                               ENV FILE                               #
########################################################################

# Environment properties (also used for docker-compose)
spring.config.import=optional:file:.env[.properties]

########################################################################
#                                FILES                                 #
########################################################################

#Files' upload Configuration
spring.servlet.multipart.enabled=true

#uploading directory (Please Make sure you change this to the absolute path of the folder in the hosting machine)

file.upload-dir = ${FILE_UPLOAD_DIR}
avatar.upload-dir = ${AVATAR_UPLOAD_DIR}

# Questions File
file.questions-file = classpath:com/elit/outildedecision/service/implementation/MultiCriteriaAnalysisFormSchema.Json
# Recommandations File
file.recommandations-file = classpath:com/elit/outildedecision/service/implementation/RecommandationsIA.json
# Matrix project kiviat
file.kiviatProject-file = classpath:com/elit/outildedecision/service/implementation/KiviatProjectMatrix.json

#Threshold after which files are written to the disk
spring.servlet.multipart.file-size-threshold = 2KB
#Max File Size
spring.servlet.multipart.max-file-size = 200MB
#Max Request Size
spring.servlet.multipart.max-request-size = 215MB

########################################################################
#                                EMAIL                                 #
########################################################################

# Spring smtp configuration
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Azure Communication Service Connection String
azure.communication.connection-string=endpoint=https://sogetilabs-communication-service.europe.communication.azure.com/;accesskey=

########################################################################
#                               SWAGGER                                #
########################################################################

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-login-endpoint=true
springdoc.show-oauth2-endpoints=true
springdoc.openapi.info.title=ELIT-API-Doc-Local
springdoc.openapi.info.description=ELIT api documentaion in Development
springdoc.openapi.info.version=v1.0


########################################################################
#                               PMM INFO                               #
########################################################################

# PMM endpoint
iaApi.value-url=https://integ.elit-pmm-pred.innovation-factory.io/api/process_predict

########################################################################
#                          MISC BUISNESS RULES                         #
########################################################################

#servlet context root path
server.servlet.context-path=/api

# values of url back and front
backend.value-url=${REACT_APP_BACKEND_API}
frontend.value-url=${FRONTEND_URL}

# Max Allowed Evaluation for a question
max-allowed-evaluation = 5

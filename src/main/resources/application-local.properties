########################################################################
#                   LOCAL APPLICATION PROPERTIES                     #
########################################################################

########################################################################
#                               LOGGING                                #
########################################################################

logging.level.root=INFO

########################################################################
#                                  DB                                  #
########################################################################
# Logs pour les requêtes HTTP (niveau DEBUG pour affichage complet)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
# Logs détaillés des requêtes et réponses HTTP
logging.level.org.springframework.web=DEBUG
# Logs pour voir les paramètres des requêtes
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
# Logs pour voir les exceptions
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=TRACE
# Logs pour voir les réponses HTTP
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseBodyAdvice=TRACE
# Logs pour les intercepteurs HTTP
logging.level.org.springframework.web.servlet.HandlerMapping=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# ==================== CONFIGURATION COMMONSREQUESTLOGGINGFILTER ====================
# Active l'inclusion des query parameters dans les logs
spring.http.log.request.include-query-string=true
spring.http.log.request.include-headers=true
# Active l'inclusion du payload/body dans les logs
spring.http.log.request.include-payload=true
# Taille maximale du payload à logger (en caractères) - -1 pour illimité
spring.http.log.request.max-payload-length=-1
# Préfixe pour les logs de requête
spring.http.log.request.prefix=REQUEST:
# Préfixe pour les logs de réponse
spring.http.log.request.suffix=

# ==================== LOGS DÉTAILLÉS POUR DEBUGGING ====================
# Logs pour voir le contenu des requêtes JSON
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG
# Logs pour les validations des requêtes
logging.level.org.springframework.validation=DEBUG
# Logs pour Jackson (parsing JSON)
logging.level.com.fasterxml.jackson=DEBUG

########################################################################
#                                  DB                                  #
########################################################################

# Datasource : H2
spring.datasource.url=jdbc:h2:mem:${MYSQL_DATABASE};NON_KEYWORDS=VALUE,USER
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver

# JPA
# No need for ddl-auto as we have liquibase which is much safer for production as per Hibernate's own website
spring.jpa.hibernate.ddl-auto=update

# Prettify SQL statements
spring.jpa.properties.hibernate.format_sql=true
# Print sql statements (if we have logging enabled of course)

#####################################################################
#         DO NOT use spring.jpa.show-sql=true, instead, use         #
#####################################################################
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Let hibernate detect dialect instead of forcing H2

# H2 specific
# Enable console
spring.h2.console.enabled=true
# Allow remote connections for sql clients
spring.h2.console.settings.web-allow-others=true

########################################################################
#                               LIQUIBASE                              #
########################################################################

spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:liquibase/dev/master.xml

########################################################################
#                               SECURITY                               #
########################################################################

spring.security.user.name=${SPRING_BACK_USERNAME}
spring.security.user.password=${SPRING_BACK_PASSWORD}

# Expiration date for access tokens 30 min (in milliseconds)
jwt.access-token-expiration-time=1800000
# Expiration date for refresh token 12hrs (in milliseconds)
jwt.refresh-token-expiration-time=43200000

jwt.secret=${JWT_SECRET_BACK}

########################################################################
#                               ENV FILE                               #
########################################################################

# Environment properties (also used for docker-compose)
spring.config.import=optional:file:.env[.properties]

########################################################################
#                                FILES                                 #
########################################################################

# Files' upload Configuration
spring.servlet.multipart.enabled=true

# Uploading directory (Please make sure you change this to the absolute path of the folder in the hosting machine)
file.upload-dir=${FILE_UPLOAD_DIR}
avatar.upload-dir=${AVATAR_UPLOAD_DIR}

# Questions File
file.questions-file=classpath:com/elit/outildedecision/service/implementation/MultiCriteriaAnalysisFormSchema.Json
# Recommendations File
file.recommandations-file=classpath:com/elit/outildedecision/service/implementation/RecommandationsIA.json
# Matrix project kiviat
file.kiviatProject-file=classpath:com/elit/outildedecision/service/implementation/KiviatProjectMatrix.json

# Threshold after which files are written to the disk
spring.servlet.multipart.file-size-threshold=2KB
# Max File Size
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

########################################################################
#                                EMAIL                                 #
########################################################################

# Spring SMTP configuration
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# Azure Communication Service Connection String
azure.communication.connection-string=endpoint=https://sogetilabs-communication-service.europe.communication.azure.com/;accesskey=

########################################################################
#                               SWAGGER                                #
########################################################################

# Swagger UI custom path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-login-endpoint=true
springdoc.show-oauth2-endpoints=true
springdoc.openapi.info.title=ELIT-API-Doc-Local
springdoc.openapi.info.description=ELIT API documentation in Development
springdoc.openapi.info.version=v1.0

########################################################################
#                               PMM INFO                               #
########################################################################

# PMM endpoint

## CETTE CONFIGURATION EST CELUI PAR DEFAULT EN ENVIRONNEMENT DE INTEG / ON A PAS DE VARIABLE D'ENVIRONNEMENT EN INTEG
iaApi.value-url=https://integ.elit-pmm-pred.innovation-factory.io/api/process_predict
ia.prediction.api.base.url=https://integ.elit-pmm-pred.innovation-factory.io/api/
ia.prediction.service.endpoint=process_predict

# CONFIGURATION A UTILISER EN DEV QUI POINTE VERS LE .ENV
#iaApi.value-url=${AI_API_URL}
#ia.prediction.api.base.url=${AI_PREDICTION_API_BASE_URL}
#ia.prediction.service.endpoint=${AI_PREDICTION_PREDICT_SERVICE_ENDPOINT}

########################################################################
#                          MISC BUSINESS RULES                         #
########################################################################

# Servlet context root path
server.servlet.context-path=/api

# Values of URL back and front
backend.value-url=${REACT_APP_BACKEND_API}
frontend.value-url=${FRONTEND_URL}

# Max Allowed Evaluation for a question
max-allowed-evaluation=5
